[project]
name = "triagem-baixo-risco"
version = "1.0.0"
description = "Triagem de baixo risco em internações do SUS no Norte de Minas, com calibração e predição conformal"
requires-python = ">=3.11,<3.14"
authors = [{name = "Paulo Victor Soares Almeida"}]
license = "MIT"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "pysus>=2.10",
  "pyreaddbc>=2.0",
  "dbfread>=2.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mkdocs>=1.6", "jupyter>=1.0", "nbconvert>=7", "ipykernel>=6"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["triagem_baixo_risco", "triagem_baixo_risco.modeling", "triagem_baixo_risco.experimentos"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# BLE001 e S110: o ETL captura qualquer exceção de propósito, para tentar o caminho alternativo (FTP -> PySUS) ou
# repetir o mês, seja qual for a falha.
# C408, RUF015, RUF046, RUF059, SIM102, SIM114, TRY004 e UP035: regras de estilo que o projeto não segue.
ignore = ["BLE001", "C408", "RUF015", "RUF046", "RUF059", "S110", "SIM102", "SIM114", "TRY004", "UP035"]
